[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "implied-vol-surface"
version = "0.1.0"
description = "Reusable visualization foundations for crypto-options volatility analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dashboard = [
    "plotly",
]
dev = [
    "pytest",
    "plotly",
]

[tool.setuptools.packages.find]
include = ["iv_surface*"]
